<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nethermind</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Sections">
    <button class="home-link" data-go="home" title="Back to the brain">← NETHERMIND <span>the brain</span></button>
    <button class="brandcard" id="brandcard" data-go="home" aria-label="Your channel"><img src="/icon.png" alt=""><div class="bc-text"><b>Nethermind</b><span>Loading your channel…</span></div></button>
    <button class="nav" data-go="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      Today<span class="count" id="count-today" hidden></span></button>
    <button class="nav" data-go="videos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>
      Videos</button>
    <button class="nav" data-go="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Calendar</button>
    <button class="nav" data-go="performance">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/></svg>
      Performance</button>
    <button class="nav" data-go="ideas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
      Ideas</button>
    <button class="nav" data-go="comments">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>
      Comments<span class="count" id="count-comments" hidden></span></button>
    <button class="nav" data-go="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
      Settings</button>
    <div class="side-foot">
      <button class="activity" id="activity" hidden></button>
      <button class="kbd-hint" id="open-palette">Ask or go anywhere <kbd>⌘K</kbd></button>
    </div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<script src="/app.js"></script>
<script src="/app2.js"></script>
<script src="/neural.js"></script>
<script src="/brain.js"></script>
<script src="/app3.js"></script>
</body>
</html>
