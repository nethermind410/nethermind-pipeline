name: Render and post (manual)

# Manual trigger ONLY — no schedule/cron. Per the project's standing autonomy
# boundary (working-preferences.md): a scheduled/automatic task never
# publishes a Buffer post without a human in the loop. This workflow only
# runs when someone clicks "Run workflow" in the Actions tab and explicitly
# reviews the output before deciding whether to actually post.
on:
  workflow_dispatch:
    inputs:
      config:
        description: >-
          Video id (the cfg/<id>.json name), e.g. regrow_body. Newer videos render
          from the asset bundle ./build.sh uploads to R2 (bundles/<id>.tar.gz);
          the old NASA/NOAA configs still work from fetch_assets.sh alone.
        required: true
        default: regrow_body
        type: string
      publish:
        description: >-
          Actually post to Buffer for real (uploads to R2, creates a live
          Buffer post in the queue). Leave OFF (default) to just render and
          run buffer_post.py in --dry-run mode — prints exactly what would be
          posted without touching Buffer or R2 at all. Flip this on only once
          you've reviewed a dry run and the rendered video artifact.
        required: true
        default: false
        type: boolean
      platforms:
        description: 'Comma-separated platforms for buffer_post.py (youtube,instagram,tiktok)'
        required: true
        default: youtube,instagram,tiktok

jobs:
  render-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps (ffmpeg, espeak-ng for Kokoro)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Cache Kokoro model files
        id: kokoro-cache
        uses: actions/cache@v4
        with:
          path: |
            kokoro-v1.0.fp16.onnx
            voices-v1.0.bin
          key: kokoro-model-v1.0

      - name: Download Kokoro model files (~200MB, cached after first run)
        if: steps.kokoro-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o kokoro-v1.0.fp16.onnx \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.fp16.onnx
          curl -L -o voices-v1.0.bin \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Fetch public-domain assets (NASA/NOAA/ESA, safe to re-run)
        run: ./fetch_assets.sh

      - name: Validate video id
        run: |
          [[ "${{ inputs.config }}" =~ ^[a-z0-9_]+$ && -f "cfg/${{ inputs.config }}.json" ]] \
            || { echo "no cfg/${{ inputs.config }}.json"; exit 1; }

      - name: Pull this video's asset bundle from R2 (skipped if none uploaded)
        env:
          BASE: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          mkdir -p assets
          if curl -fsSL -o /tmp/bundle.tgz "${BASE%/}/bundles/${{ inputs.config }}.tar.gz"; then
            tar xzf /tmp/bundle.tgz -C assets && echo "bundle restored"
          else
            echo "no bundle for ${{ inputs.config }} (fine for public-domain configs)"
          fi

      - name: Render main + TikTok cut, QA, thumbnail
        env:
          PY: python3
        run: ./build.sh "${{ inputs.config }}" --no-fetch

      - name: Resolve rendered MP4 filename from the config
        id: cfgfile
        # make_short.py names the .mp4 after the config's own "file" field
        # (falls back to the config id/filename if "file" is absent), but
        # always names the .srt after the config id -- two different
        # conventions in the same script. Read the real one instead of
        # assuming it matches the dropdown value (bit us on run #1: the
        # greenland_shark config's "file" is "05_Greenland_Shark", so
        # out/greenland_shark.mp4 never existed).
        run: |
          FILE=$(python3 -c "import json; print(json.load(open('cfg/${{ inputs.config }}.json')).get('file', '${{ inputs.config }}'))")
          echo "Resolved mp4 basename: $FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload rendered video + subtitles as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.config }}-render
          path: |
            out/${{ steps.cfgfile.outputs.file }}.mp4
            out/${{ inputs.config }}_tiktok.mp4
            out/${{ inputs.config }}*.srt
            out/${{ inputs.config }}_qa_contact.jpg
            out/${{ inputs.config }}_thumb.jpg
            out/${{ inputs.config }}_cover.jpg
          retention-days: 14

      - name: Write .env for buffer_post.py from repo secrets
        run: |
          cat > .env << EOF
          BUFFER_API_KEY=${{ secrets.BUFFER_API_KEY }}
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}
          R2_BUCKET=${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL=${{ secrets.R2_PUBLIC_BASE_URL }}
          EOF

      - name: Post to Buffer (dry run unless "publish" is checked)
        run: |
          PACKAGING_ARG=""
          if [ -f "packaging/${{ inputs.config }}.json" ]; then
            PACKAGING_ARG="--packaging packaging/${{ inputs.config }}.json"
          fi
          DRY_RUN_FLAG="--dry-run"
          if [ "${{ inputs.publish }}" = "true" ]; then
            DRY_RUN_FLAG=""
          fi
          python3 buffer_post.py \
            --video "out/${{ steps.cfgfile.outputs.file }}.mp4" \
            --tiktok-video "out/${{ inputs.config }}_tiktok.mp4" \
            --platforms "${{ inputs.platforms }}" \
            $PACKAGING_ARG \
            $DRY_RUN_FLAG
