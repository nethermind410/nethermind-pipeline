[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipping-farm"
version = "0.1.0"
description = "Credit-conscious authorised clip production harness"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0,<13",
    "yt-dlp>=2025.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]
asr-mlx = [
    "mlx-whisper>=0.4.3,<0.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.setuptools.packages.find]
include = ["clipping_farm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
clipping-farm = "clipping_farm.cli:main"
